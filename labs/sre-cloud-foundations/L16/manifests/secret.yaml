# Lab fixture Secret: the value is fake and says so. It is wired in now so
# you can see how a secret reaches a container without appearing in the
# Deployment, in `kubectl describe pod`, or in Beacon's logs (Beacon redacts
# store.url). The store itself stays in memory in this lab.
apiVersion: v1
kind: Secret
metadata:
  name: beacon-secrets
  namespace: beacon
  labels:
    app.kubernetes.io/name: beacon
    looped.lab/id: L16
type: Opaque
stringData:
  store-url: postgresql://beacon:lab-l16-db-password-not-a-real-secret@postgres.beacon.svc:5432/beacon
