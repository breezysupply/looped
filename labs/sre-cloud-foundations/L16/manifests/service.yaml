# ClusterIP Service for Beacon: port 80 inside the cluster -> the pods' named
# port "http" (8080). The EndpointSlice controller lists every pod the
# selector matches, with conditions.ready mirroring each pod's readiness.
apiVersion: v1
kind: Service
metadata:
  name: beacon
  namespace: beacon
  labels:
    app.kubernetes.io/name: beacon
    looped.lab/id: L16
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: beacon
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
