# Beacon behind a Service (L16): configuration from a ConfigMap and a Secret,
# and three probes that each answer a different question:
#   startupProbe   has the process finished starting? (holds off the other two)
#   readinessProbe should this pod receive traffic now? (/ready checks dependencies)
#   livenessProbe  is the process wedged and worth restarting? (/healthz never checks dependencies)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon
  namespace: beacon
  labels:
    app.kubernetes.io/name: beacon
    app.kubernetes.io/part-of: looped
    looped.lab/id: L16
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: beacon
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beacon
        app.kubernetes.io/component: api
        looped.lab/id: L16
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.lab/beacon:1.4.0
          imagePullPolicy: IfNotPresent   # loaded into the nodes by kind load; never pulled
          args: ["api"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: beacon-config
          env:
            - name: BEACON_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: beacon-secrets
                  key: store-url
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
