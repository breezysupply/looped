# Beacon API: two replicas spread across nodes, bounded requests and a memory limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon-api
  namespace: beacon
  labels: {app: beacon-api, looped.lab/id: L17}
spec:
  replicas: 2
  selector:
    matchLabels: {app: beacon-api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: beacon-api, looped.lab/id: L17}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: beacon-api}
      containers:
        - name: api
          image: looped-l17-beacon:1.4.0
          imagePullPolicy: IfNotPresent
          args: ["api"]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: beacon-api
  namespace: beacon
  labels: {app: beacon-api, looped.lab/id: L17}
spec:
  selector: {app: beacon-api}
  ports:
    - {name: http, port: 8080, targetPort: http}
