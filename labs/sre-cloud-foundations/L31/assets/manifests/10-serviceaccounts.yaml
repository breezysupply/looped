# One identity per workload, none of them mounts an API token (none calls the Kubernetes API).
# beacon-deployer is the release bot; its Role and RoleBinding come from L18/manifests/20-rbac.yaml.
apiVersion: v1
kind: ServiceAccount
metadata: {name: beacon-db, namespace: __NAMESPACE__, labels: {looped.lab/id: L31}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: beacon-queue, namespace: __NAMESPACE__, labels: {looped.lab/id: L31}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: beacon-worker, namespace: __NAMESPACE__, labels: {looped.lab/id: L31}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: beacon-deployer, namespace: __NAMESPACE__, labels: {looped.lab/id: L31}}
automountServiceAccountToken: false
