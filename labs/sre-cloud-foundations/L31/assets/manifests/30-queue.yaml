# Redis as Beacon's job queue (queue.kind=redis). No persistence: queued jobs are disposable
# in this lab, the database is the system of record. Pinned by version and index digest.
apiVersion: v1
kind: Service
metadata: {name: beacon-queue, namespace: __NAMESPACE__, labels: {app: beacon-queue, looped.lab/id: L31}}
spec:
  selector: {app: beacon-queue}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: beacon-queue, namespace: __NAMESPACE__, labels: {app: beacon-queue, looped.lab/id: L31}}
spec:
  replicas: 1
  selector: {matchLabels: {app: beacon-queue}}
  template:
    metadata: {labels: {app: beacon-queue, looped.lab/id: L31}}
    spec:
      serviceAccountName: beacon-queue
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: __REDIS_IMAGE__
          args: ["--save", "", "--appendonly", "no"]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          emptyDir: {sizeLimit: 64Mi}
