# L27 — Beacon ingest API (scalable), PostgreSQL, and a bounded load
# generator. Compose project looped-l27 (scripts pass -p looped-l27 -f work/compose.yaml).
# The API is reached only from inside the project network; nothing is
# published except the database on 127.0.0.1 for the validator.
# The database password is a lab placeholder, not a secret (L25 covers that).
name: looped-l27

x-py: &py
  image: python:3.12.7-slim-bookworm@sha256:60d9996b6a8a3689d36db740b49f4327be3be09a21122bd02fb8895abb38b50d
  user: "65534:65534"
  read_only: true
  environment: &pyenv
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONPATH: /lab
  labels:
    looped.lab/id: L27

services:
  db:
    image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    container_name: looped-l27-db
    command: ["postgres", "-c", "max_connections=30"]
    cpus: 1.0
    mem_limit: 512m
    environment:
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: lab-l27-db-not-a-real-secret
      POSTGRES_DB: beacon
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../assets/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:15027:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "beacon", "-d", "beacon"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 60s
    labels:
      looped.lab/id: L27

  # The API. No container_name, so `--scale api=N` works; replicas share the
  # service name `api` in DNS. Limits come from work/limits.env.
  api:
    <<: *py
    command: ["python3", "-u", "/lab/ingest.py"]
    cpus: 1.0
    mem_limit: 256m
    restart: unless-stopped
    env_file: [limits.env]
    environment:
      <<: *pyenv
      MALLOC_ARENA_MAX: "2"
      DB_DSN: "host=db port=5432 user=beacon password=lab-l27-db-not-a-real-secret dbname=beacon sslmode=disable"
    volumes:
      - ../assets/ingest.py:/lab/ingest.py:ro
      - ../assets/pgmini.py:/lab/pgmini.py:ro
    depends_on:
      db:
        condition: service_healthy

  # Bounded load generator: `bash assets/run-load.sh <label> [rps] [seconds]`.
  # Client policy comes from work/client.env.
  loadgen:
    <<: *py
    user: "${LOOPED_UID:-65534}:${LOOPED_GID:-65534}"
    profiles: ["tools"]
    entrypoint: ["python3", "-u", "/lab/loadgen.py"]
    cpus: 1.0
    mem_limit: 256m
    env_file: [client.env]
    volumes:
      - ../assets/loadgen.py:/lab/loadgen.py:ro
      - ./runs:/runs

volumes:
  pgdata:
    name: looped-l27-pgdata
    labels:
      looped.lab/id: L27

networks:
  default:
    name: looped-l27-net
    labels:
      looped.lab/id: L27
