apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "beacon.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
data:
  # Beacon's YAML subset (maps and scalars only). No secrets here: credentials would come from a
  # Secret created outside the chart and referenced by name.
  beacon.yaml: |
    server:
      listen: 0.0.0.0
      port: 8080
    app:
      environment: {{ .Values.config.environment }}
      admin_enabled: {{ .Values.config.adminEnabled }}
    store:
      kind: memory
    queue:
      kind: none
    inject:
      delay_ms: {{ .Values.config.inject.delayMs | default 0 | int }}
      fail_rate: {{ .Values.config.inject.failRate | default 0 }}
      ready_fail: false
