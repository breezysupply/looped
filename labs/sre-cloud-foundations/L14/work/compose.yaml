# Beacon on Compose (L14): api + worker + PostgreSQL in one project.
#   docker compose -f labs/sre-cloud-foundations/L14/work/compose.yaml <command>
# The project name is fixed below, so every container, network and volume is
# looped-l14-* / looped-l14_* and carries the label looped.lab/id=L14.
# Credentials here are lab fixtures (they say so); never reuse the pattern for
# real secrets — L25 covers rotation and secret stores.
name: looped-l14

x-beacon-env: &beacon-env
  BEACON_STORE_KIND: postgres
  BEACON_STORE_URL: postgresql://beacon:lab-l14-db-password-not-a-real-secret@postgres:5432/beacon
  BEACON_QUEUE_KIND: dir
  BEACON_QUEUE_DIR: /var/lib/beacon/queue
  BEACON_WORKER_EFFECTS_PATH: /var/lib/beacon/queue/effects.jsonl
  BEACON_APP_ENVIRONMENT: compose-lab

services:
  db:
    image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    labels:
      looped.lab/id: L14
    environment:
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: lab-l14-db-password-not-a-real-secret
      POSTGRES_DB: beacon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP on 127.0.0.1, not the Unix socket: during first-run initialisation
      # the image starts a temporary server that listens on the socket only, so
      # a socket check would report "ready" before the real server is up.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "beacon", "-d", "beacon"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 90s
    stop_grace_period: 20s

  api:
    build:
      context: ./app
      labels:
        looped.lab/id: L14
    image: looped-l14-beacon:1.4.0
    labels:
      looped.lab/id: L14
    environment: *beacon-env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18014:8080"
    volumes:
      - queue:/var/lib/beacon/queue
    stop_grace_period: 10s
    restart: "no"

  worker:
    image: looped-l14-beacon:1.4.0
    pull_policy: never          # built by the api service above; never pulled
    labels:
      looped.lab/id: L14
    command: ["worker", "--metrics-port", "9101"]
    environment: *beacon-env
    depends_on:
      api:
        condition: service_started
    volumes:
      - queue:/var/lib/beacon/queue
    healthcheck:
      # the worker has no API; it serves /healthz next to its metrics on 9101
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9101/healthz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 10s
    restart: "no"

volumes:
  pgdata:
    labels:
      looped.lab/id: L14
  queue:
    labels:
      looped.lab/id: L14

networks:
  default:
    labels:
      looped.lab/id: L14
