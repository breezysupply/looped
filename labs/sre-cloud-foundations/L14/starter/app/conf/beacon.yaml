# Beacon defaults baked into the L14 image. compose.yaml overrides the store,
# queue and worker settings with BEACON_<SECTION>_<KEY> environment variables.
server:
  listen: 0.0.0.0
  port: 8080
app:
  version: "1.4.0"
  environment: compose-lab
  admin_enabled: false
store:
  kind: memory
queue:
  kind: none
