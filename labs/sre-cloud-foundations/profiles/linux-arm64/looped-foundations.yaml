# Lima instance for the SRE & Cloud Deployment Foundations host labs.
#   limactl create --name looped-foundations labs/sre-cloud-foundations/profiles/linux-arm64/looped-foundations.yaml
#   (vm-create.sh does this and runs bootstrap.sh)
#
# Ubuntu 24.04 (noble) cloud images. Lima verifies the digest it records for
# the image at create time; the "current" URLs below are what the course was
# written against. Pin to a dated image URL + sha256 if you want a byte-exact
# guest (see docs/sre-cloud-foundations/version-matrix.md).
vmType: "vz"          # Apple Virtualization framework on macOS 13+; use "qemu" elsewhere
rosetta:
  enabled: false      # nothing here needs x86 emulation
arch: "aarch64"       # change to "x86_64" on an Intel Mac / Linux PC
cpus: 2
memory: "4GiB"
disk: "20GiB"

images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"

# The repository is mounted read/write at its own path so validators can write
# evidence into your Git workspace. Nothing else from the Mac is mounted.
mounts:
  - location: "~"
    writable: false
  - location: "{{.Dir}}/../../../.."     # the repository root (labs/sre-cloud-foundations/profiles/linux-arm64 → repo)
    writable: true
  - location: "/tmp/lima"
    writable: true

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends python3 python3-venv iproute2 bind9-dnsutils bind9 nginx openssl curl jq stress-ng sqlite3 net-tools lsof
      systemctl disable --now nginx bind9 named 2>/dev/null || true
      touch /etc/looped-vm
      echo "looped-foundations $(date -u +%FT%TZ)" > /etc/looped-vm
