apiVersion: 1
datasources:
  - name: Prometheus
    uid: looped-prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: looped-jaeger
  - name: Jaeger
    uid: looped-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
