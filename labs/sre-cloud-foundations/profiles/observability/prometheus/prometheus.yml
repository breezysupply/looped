# looped-obs Prometheus. Scrapes itself, the collector, and every target listed
# in targets/*.json (file service discovery: labs add or remove targets without a
# restart). Short intervals so a lab sees changes within seconds, not minutes.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: otelcol
    static_configs:
      - targets: ["otelcol:8888"]
  - job_name: labs
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.json"]
        refresh_interval: 5s
