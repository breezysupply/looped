# Beacon in the policy cluster: API, an unrelated report service, PostgreSQL. Each workload has
# its own ServiceAccount with no API token mounted (none of them call the Kubernetes API).
apiVersion: v1
kind: ServiceAccount
metadata: {name: beacon-api, namespace: beacon, labels: {looped.lab/id: L18}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: beacon-report, namespace: beacon, labels: {looped.lab/id: L18}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: beacon-db, namespace: beacon, labels: {looped.lab/id: L18}}
automountServiceAccountToken: false
---
# the deploy bot's identity: it rolls out new builds of beacon-api and reads their logs
apiVersion: v1
kind: ServiceAccount
metadata: {name: beacon-deployer, namespace: beacon, labels: {looped.lab/id: L18}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata: {name: beacon-db-auth, namespace: beacon, labels: {app: beacon-db, looped.lab/id: L18}}
type: Opaque
stringData:
  POSTGRES_PASSWORD: lab-l18-db-password-not-a-real-secret
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: beacon-db, namespace: beacon, labels: {app: beacon-db, looped.lab/id: L18}}
spec:
  replicas: 1
  selector: {matchLabels: {app: beacon-db}}
  template:
    metadata: {labels: {app: beacon-db, looped.lab/id: L18}}
    spec:
      serviceAccountName: beacon-db
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
          env:
            - {name: POSTGRES_DB, value: beacon}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: beacon-db-auth, key: POSTGRES_PASSWORD}}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres", "-d", "beacon"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
        - name: data
          emptyDir: {sizeLimit: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: beacon-db, namespace: beacon, labels: {app: beacon-db, looped.lab/id: L18}}
spec:
  selector: {app: beacon-db}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: beacon-api, namespace: beacon, labels: {app: beacon-api, looped.lab/id: L18}}
spec:
  replicas: 1
  selector: {matchLabels: {app: beacon-api}}
  template:
    metadata: {labels: {app: beacon-api, looped.lab/id: L18}}
    spec:
      serviceAccountName: beacon-api
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: looped-l18-beacon:1.4.0
          imagePullPolicy: IfNotPresent
          args: ["api"]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
---
apiVersion: v1
kind: Service
metadata: {name: beacon-api, namespace: beacon, labels: {app: beacon-api, looped.lab/id: L18}}
spec:
  selector: {app: beacon-api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
# an unrelated service in the same namespace: it has no business talking to the database
apiVersion: apps/v1
kind: Deployment
metadata: {name: beacon-report, namespace: beacon, labels: {app: beacon-report, looped.lab/id: L18}}
spec:
  replicas: 1
  selector: {matchLabels: {app: beacon-report}}
  template:
    metadata: {labels: {app: beacon-report, looped.lab/id: L18}}
    spec:
      serviceAccountName: beacon-report
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: report
          image: looped-l18-beacon:1.4.0
          imagePullPolicy: IfNotPresent
          args: ["api", "--port", "9090"]
          ports: [{name: http, containerPort: 9090}]
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
---
apiVersion: v1
kind: Service
metadata: {name: beacon-report, namespace: beacon, labels: {app: beacon-report, looped.lab/id: L18}}
spec:
  selector: {app: beacon-report}
  ports: [{name: http, port: 9090, targetPort: http}]
