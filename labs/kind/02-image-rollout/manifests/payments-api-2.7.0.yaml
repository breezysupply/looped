# Lab 02: payments-api release 2.7.0.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  labels: { app: payments-api, looped.lab/id: "02" }
  annotations:
    kubernetes.io/change-cause: "release 2.7.0"
spec:
  replicas: 3
  # Lab simplification: the default progress deadline is 600s; 120s shows the
  # ProgressDeadlineExceeded condition sooner.
  progressDeadlineSeconds: 120
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: payments-api }
  template:
    metadata:
      labels: { app: payments-api, looped.lab/id: "02" }
    spec:
      terminationGracePeriodSeconds: 5
      nodeSelector: { pool: general }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: api
        image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sh", "-c"]
        args:
        - |
          echo "payments-api $APP_VERSION ok" > /www/index.html
          echo ok > /www/healthz
          echo "payments-api $APP_VERSION listening on :8080"
          exec httpd -f -p 8080 -h /www
        env:
        - { name: APP_VERSION, value: "2.7.0" }
        ports:
        - { name: http, containerPort: 8080 }
        readinessProbe:
          httpGet: { path: /healthz, port: http }
          periodSeconds: 5
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { memory: 32Mi }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        volumeMounts:
        - { name: www, mountPath: /www }
      volumes:
      - name: www
        emptyDir: {}
