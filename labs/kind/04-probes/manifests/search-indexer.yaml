# Lab 04: search-indexer. Warms its index for about 40 seconds before it starts
# serving /healthz on :8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-indexer
  labels: { app: search-indexer, looped.lab/id: "04" }
spec:
  replicas: 1
  selector:
    matchLabels: { app: search-indexer }
  template:
    metadata:
      labels: { app: search-indexer, looped.lab/id: "04" }
    spec:
      terminationGracePeriodSeconds: 5
      nodeSelector: { pool: general }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: indexer
        image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sh", "-c"]
        args:
        - |
          trap 'echo "$(date -u +%H:%M:%S) received SIGTERM, exiting"; exit 143' TERM
          echo "$(date -u +%H:%M:%S) warming index (takes about 40s)"
          sleep 40 & wait $!
          echo ok > /www/healthz
          echo "$(date -u +%H:%M:%S) index warm; listening on :8080"
          exec httpd -f -p 8080 -h /www
        ports:
        - { name: http, containerPort: 8080 }
        readinessProbe:
          httpGet: { path: /healthz, port: http }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /healthz, port: http }
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 2
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { memory: 32Mi }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        volumeMounts:
        - { name: www, mountPath: /www }
      volumes:
      - name: www
        emptyDir: {}
