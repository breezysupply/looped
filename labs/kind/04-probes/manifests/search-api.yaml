# Lab 04: search-api. Serves / and /healthz on :8080 (it has no /ready page).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  labels: { app: search-api, looped.lab/id: "04" }
spec:
  replicas: 2
  selector:
    matchLabels: { app: search-api }
  template:
    metadata:
      labels: { app: search-api, looped.lab/id: "04" }
    spec:
      terminationGracePeriodSeconds: 5
      nodeSelector: { pool: general }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: api
        image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sh", "-c"]
        args:
        - |
          echo "search-api ok" > /www/index.html
          echo ok > /www/healthz
          echo "search-api listening on :8080 (pages: /, /healthz)"
          exec httpd -f -vv -p 8080 -h /www
        ports:
        - { name: http, containerPort: 8080 }
        readinessProbe:
          httpGet: { path: /ready, port: http }
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet: { path: /healthz, port: http }
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { memory: 32Mi }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        volumeMounts:
        - { name: www, mountPath: /www }
      volumes:
      - name: www
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: search-api
  labels: { app: search-api, looped.lab/id: "04" }
spec:
  selector: { app: search-api }
  ports:
  - { name: http, port: 8080, targetPort: http }
