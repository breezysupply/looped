# Lab 06: notify-api 3.0.0. Configuration moved to ConfigMap notify-config,
# which the release pipeline was supposed to create.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify-api
  labels: { app: notify-api, looped.lab/id: "06" }
  annotations:
    kubernetes.io/change-cause: "release 3.0.0 (config moved to ConfigMap notify-config)"
spec:
  replicas: 2
  selector:
    matchLabels: { app: notify-api }
  template:
    metadata:
      labels: { app: notify-api, looped.lab/id: "06" }
    spec:
      terminationGracePeriodSeconds: 5
      nodeSelector: { pool: general }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: api
        image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sh", "-c"]
        args:
        - |
          echo "$(date -u +%H:%M:%S) notify-api 3.0.0 starting"
          if [ -z "$NOTIFY_ENDPOINT" ]; then
            echo "$(date -u +%H:%M:%S) FATAL: NOTIFY_ENDPOINT is not set (expected key 'endpoint' in ConfigMap notify-config); exiting 1"
            exit 1
          fi
          echo "notify-api 3.0.0 ok" > /www/index.html
          echo ok > /www/healthz
          echo "$(date -u +%H:%M:%S) notify-api 3.0.0 using endpoint $NOTIFY_ENDPOINT; listening on :8080"
          exec httpd -f -p 8080 -h /www
        env:
        - name: NOTIFY_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: notify-config
              key: endpoint
              optional: true
        ports:
        - { name: http, containerPort: 8080 }
        readinessProbe:
          httpGet: { path: /healthz, port: http }
          periodSeconds: 5
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { memory: 32Mi }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        volumeMounts:
        - { name: www, mountPath: /www }
      volumes:
      - name: www
        emptyDir: {}
