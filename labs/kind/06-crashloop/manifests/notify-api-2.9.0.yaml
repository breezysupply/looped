# Lab 06: notify-api 2.9.0 (endpoint compiled in; no ConfigMap needed).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify-api
  labels: { app: notify-api, looped.lab/id: "06" }
  annotations:
    kubernetes.io/change-cause: "release 2.9.0"
spec:
  replicas: 2
  selector:
    matchLabels: { app: notify-api }
  template:
    metadata:
      labels: { app: notify-api, looped.lab/id: "06" }
    spec:
      terminationGracePeriodSeconds: 5
      nodeSelector: { pool: general }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: api
        image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sh", "-c"]
        args:
        - |
          echo "notify-api 2.9.0 ok" > /www/index.html
          echo ok > /www/healthz
          echo "notify-api 2.9.0 using built-in endpoint; listening on :8080"
          exec httpd -f -p 8080 -h /www
        ports:
        - { name: http, containerPort: 8080 }
        readinessProbe:
          httpGet: { path: /healthz, port: http }
          periodSeconds: 5
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { memory: 32Mi }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        volumeMounts:
        - { name: www, mountPath: /www }
      volumes:
      - name: www
        emptyDir: {}
