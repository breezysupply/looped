# Lab 03: storefront, a client that calls http://orders:8080/ every 3 seconds
# and logs the result.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels: { app: storefront, looped.lab/id: "03" }
spec:
  replicas: 1
  selector:
    matchLabels: { app: storefront }
  template:
    metadata:
      labels: { app: storefront, looped.lab/id: "03" }
    spec:
      terminationGracePeriodSeconds: 5
      nodeSelector: { pool: general }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: client
        image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sh", "-c"]
        args:
        - |
          trap 'exit 0' TERM
          while true; do
            if out=$(wget -q -T 2 -O - http://orders:8080/ 2>&1); then
              echo "$(date -u +%H:%M:%S) GET http://orders:8080/ -> $out"
            else
              echo "$(date -u +%H:%M:%S) GET http://orders:8080/ FAILED: $out"
            fi
            sleep 3 & wait $!
          done
        resources:
          requests: { cpu: 10m, memory: 8Mi }
          limits: { memory: 16Mi }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
