# Lab 07: transcoder, moved to a new base image yesterday. It now takes about
# 45 seconds to boot, and its entrypoint ignores SIGTERM. Memory limit: 64Mi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcoder
  labels: { app: transcoder, looped.lab/id: "07" }
spec:
  replicas: 1
  selector:
    matchLabels: { app: transcoder }
  template:
    metadata:
      labels: { app: transcoder, looped.lab/id: "07" }
    spec:
      terminationGracePeriodSeconds: 10
      nodeSelector: { pool: general }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: transcoder
        image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sh", "-c"]
        args:
        - |
          trap '' TERM
          echo "$(date -u +%H:%M:%S) transcoder booting (new base image: codec warm-up takes about 45s)"
          sleep 45
          echo ok > /www/healthz
          echo "$(date -u +%H:%M:%S) transcoder ready; listening on :8080"
          exec httpd -f -p 8080 -h /www
        ports:
        - { name: http, containerPort: 8080 }
        readinessProbe:
          httpGet: { path: /healthz, port: http }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /healthz, port: http }
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 64Mi }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        volumeMounts:
        - { name: www, mountPath: /www }
      volumes:
      - name: www
        emptyDir: {}
